# CI workflow for digipin-ts TypeScript project
# This workflow lints, typechecks, tests, and audits the codebase on pushes and pull requests to main.
# It also supports manual triggering via workflow_dispatch.
# It runs on multiple Node.js versions to ensure compatibility.
name: CI — digipin-ts

on:
    push:
        branches: [main]
        paths:
            - "src/**/*.ts"
            - "tests/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig*.json"
            - "eslint.config.ts"
    pull_request:
        branches: [main]
        paths:
            - "src/**/*.ts"
            - "tests/**/*.ts"
            - "package.json"
            - "package-lock.json"
            - "tsconfig*.json"
            - "eslint.config.ts"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Lint, Typecheck, Test, and Audit
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x, 25.x]
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies (locked)
              run: |
                  set -euo pipefail
                  npm ci

            - name: Lint (eslint)
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Run tests with coverage report
              run: |
                  npm run test:coverage

            - name: npm audit (production deps only)
              run: |
                  npm audit --omit=dev --audit-level=low

            - name: Upload coverage reports to Codecov
              uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # 6.0.0
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

            - name: Upload test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # 1.2.1
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
